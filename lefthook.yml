# Git hooks, installed by `pnpm install` (the `prepare` script runs `lefthook install`).
# Every job calls a package script, so each check can also be run by hand.
# https://lefthook.dev/configuration/

pre-commit:
  jobs:
    # Fix and re-stage the staged files first, so the checks below see the final content
    - name: format
      glob: "*.{js,mjs,cjs,ts,mts,cts,tsx,jsx,json,jsonc,md,yml,yaml}"
      exclude:
        - "repos/**"
        # Generated by varlock and ignored by oxfmt, which fails when every file it is given is ignored
        - "src/env.d.ts"
        - "web/env.d.ts"
      run: pnpm format {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,mjs,cjs,ts,mts,cts,tsx,jsx}"
      exclude:
        - "repos/**"
      # Staged files can all be in oxlint's ignorePatterns (web/components/ui/**), which oxlint treats as an error
      run: pnpm lint:fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: checks
      group:
        parallel: true
        jobs:
          - name: typecheck
            run: pnpm typecheck
          - name: test
            run: pnpm test
          - name: web
            run: pnpm --filter web check

pre-push:
  jobs:
    - name: check
      run: pnpm check
