# The GPU variant of docker-compose.yml, added by `pnpm speaches:up` when Docker has the NVIDIA runtime: the CUDA
# image (CUDA 12.4.1, which drivers from 550 support) and every GPU. Same tag as the CPU file.
services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda-12.4.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
