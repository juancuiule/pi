# Speaches, the local speech-to-text server behind dictation (src/dictation/): the app posts each spoken segment to its
# OpenAI-compatible /v1/audio/transcriptions. Bound to localhost; models are downloaded once into the hf-hub-cache
# volume and kept loaded (STT_MODEL_TTL=-1). This file runs it on the CPU; `pnpm speaches:up` adds
# docker-compose.gpu.yml when Docker has the NVIDIA runtime (see README.md). The image is pinned; update it
# deliberately, together with the GPU file's tag.
services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    restart: unless-stopped
    ports:
      - 127.0.0.1:${SPEACHES_PORT:-8000}:8000
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    environment:
      # int8 is the fastest on a CPU, and the only fast type on a Pascal GPU (no float16 throughput there).
      WHISPER__COMPUTE_TYPE: int8
      # Keep models loaded: a cold load would delay the first words of every dictation.
      STT_MODEL_TTL: "-1"
      # The model the app uses (TRANSCRIBE_MODEL), downloaded at start; up.ts then loads it with a first request.
      PRELOAD_MODELS: '["${SPEACHES_MODEL:-Systran/faster-whisper-small}"]'
      ENABLE_UI: "false"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
volumes:
  hf-hub-cache:
