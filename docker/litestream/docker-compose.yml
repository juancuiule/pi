# Litestream streams the EFFECT_PI_DB WAL to the litestream bucket on the local SeaweedFS gateway
# (docker/seaweedfs, `pnpm seaweed:up`). It mounts the repo's data/ at /data and reads litestream.yml from the
# default /etc/litestream.yml path. Credentials come from docker/seaweedfs/.env, the same file the gateway's
# init-env.ts writes. The gateway is published on the host's 127.0.0.1:8333, reached as host.docker.internal;
# extra_hosts makes that name resolve on Linux too (Docker Desktop provides it natively). See README.md for
# the restore runbook.
services:
  litestream:
    image: litestream/litestream:0.5.17
    restart: always
    # -restore-if-db-not-exists recreates data/effect-pi.sqlite from the bucket when it is missing, so
    # `pnpm litestream:up` alone covers the restore path (see README.md).
    command: replicate -restore-if-db-not-exists
    env_file: ../seaweedfs/.env
    volumes:
      - ../../data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    extra_hosts:
      - host.docker.internal:host-gateway
