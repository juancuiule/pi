# Local SeaweedFS for the S3 object store (src/storage/object-store.ts): master, volume server, filer and the
# S3 gateway in one `weed server` process (upstream marks `weed mini` dev-only). init-env.ts (`pnpm seaweed:up`)
# writes s3.json, the identity file -s3.config reads, and the matching keys in the root .env; without them the
# gateway allows every request. The S3 gateway (8333) and the filer's web UI (8888, /buckets/ to browse) are published, on loopback.
# `admin` is SeaweedFS's admin UI (cluster, volumes, buckets, files, S3 keys) on 23646, under the edge's /_/seaweedfs/
# (deploy/Caddyfile, docs/deploy/services.md); it signs in as `admin` with SEAWEEDFS_ADMIN_PASSWORD from .env here.
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: always
    command: server -dir=/data -filer -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port.iceberg=0 -s3.port.lance=0
    ports:
      - 127.0.0.1:8333:8333
      - 127.0.0.1:8888:8888
    volumes:
      - seaweedfs_data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Any HTTP answer means the gateway is up; an unsigned request gets a 403, so curl must not use -f.
      test: curl -s -o /dev/null http://localhost:8333/
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  admin:
    image: chrislusf/seaweedfs:4.48
    restart: always
    # -urlPrefix: its routes, links, assets and cookie path all carry the edge's prefix.
    # With a password it listens on every interface of its container, which is published on loopback only.
    command: admin -master=seaweedfs:9333 -dataDir=/data -urlPrefix=/_/seaweedfs
    environment:
      WEED_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD:?run pnpm seaweed:up, which writes it to docker/seaweedfs/.env}
    ports:
      - 127.0.0.1:23646:23646
    volumes:
      - seaweedfs_admin:/data
    depends_on:
      seaweedfs:
        condition: service_healthy

volumes:
  seaweedfs_data:
    driver: local
  seaweedfs_admin:
    driver: local
